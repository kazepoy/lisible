<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lisible</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="../icons/icon-48.png" alt="" width="28" height="28">
    <h1 data-i18n="extName">Lisible</h1>
    <span class="state" id="master-label"></span>
    <label class="switch">
      <input type="checkbox" id="enabled" data-i18n-label="masterSwitch" aria-label="Activer Lisible">
      <span></span>
    </label>
  </header>

  <!-- Règle de lecture : commune à tous les sites, toujours en haut. -->
  <section class="ruler" aria-labelledby="ruler-title">
    <div class="ruler-head">
      <span class="ruler-icon" aria-hidden="true">📏</span>
      <strong id="ruler-title" data-i18n="sectionRuler">Règle de lecture</strong>
      <label class="switch small">
        <input type="checkbox" data-ruler="enabled" id="ruler-enabled" data-i18n-label="sectionRuler" aria-label="Règle de lecture">
        <span></span>
      </label>
    </div>
    <!-- Réglages rarement changés : repliés par défaut. -->
    <details class="ruler-more">
      <summary data-i18n="rulerSettings">Réglages de la règle</summary>
    <div class="ruler-options" data-show-if-ruler>
      <div class="segmented" role="radiogroup" data-i18n-label="rulerMode" aria-label="Type de règle">
        <label><input type="radio" name="ruler-mode" data-ruler="mode" value="band"><span data-i18n="rulerBand">Bande</span></label>
        <label><input type="radio" name="ruler-mode" data-ruler="mode" value="mask"><span data-i18n="rulerMask">Masque</span></label>
      </div>
      <label class="mini" data-show-if-band>
        <input type="color" data-ruler="color" data-i18n-label="rulerColor" aria-label="Couleur">
      </label>
      <label class="slider compact">
        <span data-i18n="rulerHeight">Hauteur</span>
        <input type="range" data-ruler="height" min="16" max="200" step="4">
        <output data-for="height"></output>
      </label>
      <label class="slider compact">
        <span data-i18n="rulerOpacity">Opacité</span>
        <input type="range" data-ruler="opacity" min="10" max="90" step="5">
        <output data-for="opacity"></output>
      </label>
    </div>
    </details>
  </section>

  <!-- Qui est modifié : tous les sites, ou le site ouvert (en violet). -->
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-global" aria-selected="true">
      <span aria-hidden="true">🌐</span> <span data-i18n="tabGlobal">Tous les sites</span>
    </button>
    <button type="button" role="tab" id="tab-site" aria-selected="false">
      <span aria-hidden="true">📍</span> <span id="tab-site-name">—</span>
    </button>
  </nav>

  <main id="panel" role="tabpanel">
    <!-- Onglet du site -->
    <div class="site-banner" id="site-banner" hidden>
      <div class="site-row">
        <strong id="site-title"></strong>
        <label class="switch small site">
          <input type="checkbox" id="site-enabled" data-i18n-label="siteEnabled" aria-label="Lisible sur ce site">
          <span></span>
        </label>
      </div>
      <p id="site-hint"></p>
    </div>
    <div class="site-info" id="site-info" hidden>
      <p data-i18n="siteFollowsGlobal">Ce site utilise les réglages de tous les sites.</p>
      <button type="button" class="primary site" id="site-customize" data-i18n="siteCustomize">Personnaliser pour ce site</button>
    </div>

    <!-- Onglet « Tous les sites » quand le site ouvert a ses propres réglages -->
    <p class="note" id="global-note" hidden></p>

    <div class="controls" id="controls">
      <div class="line">
        <label for="font" data-i18n="font">Police</label>
        <select id="font" data-key="font"></select>
      </div>
      <p class="font-sample" aria-hidden="true">b d p q — Le chat dort</p>

      <div class="line">
        <span id="size-label" data-i18n="fontScale">Taille du texte</span>
        <span class="stepper" role="group" aria-labelledby="size-label">
          <button type="button" data-step="fontScale" data-delta="-10" data-i18n-label="smaller" aria-label="Plus petit">A−</button>
          <output data-for="fontScale"></output>
          <button type="button" data-step="fontScale" data-delta="10" class="bigger" data-i18n-label="bigger" aria-label="Plus grand">A+</button>
        </span>
      </div>

      <div class="line">
        <span id="spacing-label" data-i18n="spacing">Espacement</span>
        <span class="segmented" role="radiogroup" aria-labelledby="spacing-label">
          <label><input type="radio" name="spacing" value="normal"><span data-i18n="spacingNormal">Normal</span></label>
          <label><input type="radio" name="spacing" value="large"><span data-i18n="spacingLarge">Large</span></label>
          <label><input type="radio" name="spacing" value="xlarge"><span data-i18n="spacingXLarge">Très large</span></label>
        </span>
      </div>
      <p class="hint" id="spacing-custom" data-i18n="spacingCustom" hidden>Espacement ajusté finement dans « Plus de réglages ».</p>

      <div class="line">
        <span id="bg-label" data-i18n="background">Fond</span>
        <span class="swatches" id="bg-swatches" role="radiogroup" aria-labelledby="bg-label"></span>
      </div>
      <p class="hint" id="bg-custom" data-i18n="bgCustom" hidden>Couleurs choisies dans « Plus de réglages ».</p>

      <p class="back" id="site-back" hidden>
        <button type="button" class="link" id="site-revert" data-i18n="siteRevert">Revenir aux réglages de tous les sites</button>
      </p>
    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" class="link" id="undo" data-i18n="undo">Annuler</button>
  </div>

  <footer class="bottom">
    <button type="button" class="link" id="more"><span aria-hidden="true">⚙</span> <span data-i18n="moreSettings">Plus de réglages</span></button>
    <button type="button" class="link muted" id="reset" data-i18n="reset">Réinitialiser</button>
  </footer>

  <script src="../shared/settings.js"></script>
  <script src="../shared/style.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
